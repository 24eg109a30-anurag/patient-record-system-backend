# Render Blueprint for patient-record-system-backend
# Deploy via: Render Dashboard -> New -> Blueprint -> select this repo
services:
  - type: web
    name: patient-record-system-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ehr-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ehr-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ehr-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: ehr-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: ehr-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: ehr-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: ehr-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_AI_OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
  - type: keyvalue
    name: ehr-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: ehr-postgres
    databaseName: ehr_db
    user: ehr_admin
    plan: free
    postgresMajorVersion: 16
    # After first deploy, run: CREATE EXTENSION IF NOT EXISTS vector;
    # via Render Postgres dashboard -> Connect -> PSQL
