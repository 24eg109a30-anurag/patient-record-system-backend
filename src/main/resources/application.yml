server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ehr-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ehr_db}
    username: ${DB_USER:ehr_admin}
    password: ${DB_PASS:ehr_secure_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:demo-api-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

# Security & Application Settings
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  consent:
    otp-expiration-minutes: 15
    token-validity-hours: 2
  break-glass:
    notification-email: compliance-alert@national-ehr.gov
  storage:
    upload-dir: /app/uploads/medical-documents
